<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Resume AI - ATS Resume Analyzer & Builder</title>
  <meta name="title" content="Resume AI - ATS Resume Analyzer & Builder">
  <meta name="description"
    content="AI-powered resume analyzer and builder. Optimize your resume for ATS, track job applications, and land your dream job with our free tools.">
  <meta name="keywords" content="resume analyzer, ATS checker, resume builder, job tracker, AI resume, career tools">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resumeai.live">
  <meta property="og:title" content="Resume AI - ATS Resume Analyzer & Builder">
  <meta property="og:description"
    content="AI-powered resume analyzer and builder. Optimize your resume for ATS, track job applications, and land your dream job.">
  <meta property="og:image" content="https://resumeai.live/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://resumeai.live">
  <meta property="twitter:title" content="Resume AI - ATS Resume Analyzer & Builder">
  <meta property="twitter:description"
    content="AI-powered resume analyzer and builder. Optimize your resume for ATS, track job applications, and land your dream job.">
  <meta property="twitter:image" content="https://resumeai.live/og-image.png">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://resumeai.live">

  <!-- Icons. The SVG is the primary favicon; the PNGs cover browsers that
       ignore it, iOS home screens, and Android's maskable safe zone. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0A0A0A" />

  <!-- Paint the dark ground before CSS loads, so there is no white flash -->
  <meta name="color-scheme" content="dark">
  <style>html{background:#000}</style>

  <!-- Satoshi carries the whole interface - geometric but warm, which is the
       register this design targets. Computer Modern stays for the resume PDF
       preview, which has to look like a typeset document. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/vsalvino/computer-modern@main/fonts/serif.css">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link
    href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap"
    rel="stylesheet" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4LWRL4TED1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-4LWRL4TED1');
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
